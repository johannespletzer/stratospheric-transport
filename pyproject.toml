[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "residence_time"
version = "0.1"
description = "Neural network modeling for mean age of air and residence time"
authors = [
    { name="Johannes Pletzer"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "torch",
    "scikit-learn",
    "matplotlib",
    "xarray",
    "netCDF4",
    "pandas",
    "aerocalc3"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["residence_time*"]
