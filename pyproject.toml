[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "residence_time"
version = "0.1"
description = "Neural network modeling for mean age of air and residence time"
authors = [
    { name="Johannes Pletzer"}
]

readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "torch",
    "scikit-learn",
    "matplotlib",
    "xarray",
    "netCDF4",
    "pandas",
    "aerocalc3",
    "pytest",
    "requests",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["residence_time*"]

[tool.ruff]
line-length = 88
target-version = "py38"
fix = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C90",  # mccabe complexity
]
ignore = [
    "E501",  # line too long (optional if using black)
]
