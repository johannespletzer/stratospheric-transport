name: Test ERA5 Tropopause Scripts

on:
  push:
    branches: [ main, devel ]
  pull_request:
    branches: [ main, devel ]

jobs:
  test-scripts:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dask distributed xarray numpy pandas

      - name: Run download_and_process_era5.py
        run: |
          python residence_time/scripts/download_and_process_era5.py \
            --start-year 2000 --end-year 2000 \
            --output temp/era5_test

      - name: Check combined output exists
        run: |
          test -f temp/era5_test/era5_tropopause_combined.nc

      - name: Run process_tropopause_features.py
        run: |
          python residence_time/scripts/process_tropopause_features.py \
            --infile temp/era5_test/era5_tropopause_combined.nc \
            --outfile temp/tropopause_features_test.csv

      - name: Check processed output exists
        run: |
          test -f temp/tropopause_features_test.csv
